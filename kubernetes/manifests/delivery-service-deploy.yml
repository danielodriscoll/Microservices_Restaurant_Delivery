apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-service-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: delivery-service
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: delivery-service
    spec:
      containers:
      - name: delivery-service
        image: dodriscoll4/delivery-service:latest
        ports:
        - containerPort: 50053
        env:
        - name: RUNNING_IN_DOCKER
          value: "true"